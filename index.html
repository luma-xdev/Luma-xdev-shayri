<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMA — TOP 10,000 SHAYARI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  color:#f8edf4;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 15%,#402445 0%,#18101d 32%,#07050a 75%);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background-image:
    radial-gradient(circle,#ffffff 1px,transparent 1.5px);
  background-size:75px 75px;
}

body::after{
  content:"♡  ✦  ♡  ✦  ♡";
  position:fixed;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:90px;
  letter-spacing:55px;
  opacity:.025;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

/* ================= HEADER ================= */

.hero{
  min-height:92vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:50px 0;
}

.hero-inner{
  width:100%;
  max-width:850px;
}

.logo{
  width:115px;
  height:115px;
  object-fit:contain;
  display:block;
  margin:0 auto 25px;
  filter:drop-shadow(0 0 25px rgba(224,157,198,.55));
}

.eyebrow{
  font-size:10px;
  letter-spacing:5px;
  color:#c9a9bc;
  text-transform:uppercase;
}

h1{
  margin:18px 0 10px;
  font-family:Georgia,serif;
  font-size:clamp(55px,12vw,110px);
  font-weight:400;
  letter-spacing:2px;
  background:linear-gradient(90deg,#fff,#e6b6d1,#c9b4e6);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  color:#b9adb8;
  font-size:14px;
  line-height:1.8;
}

.total{
  margin-top:25px;
  color:#dfaeca;
  letter-spacing:4px;
  font-size:12px;
}

.open-btn{
  margin-top:35px;
  border:1px solid rgba(235,190,215,.3);
  background:rgba(255,255,255,.04);
  color:#fff;
  padding:14px 28px;
  border-radius:40px;
  cursor:pointer;
  transition:.3s;
}

.open-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 35px rgba(220,150,195,.15);
}

/* ================= SECTION ================= */

.section-title{
  text-align:center;
  margin:30px 0 35px;
}

.section-title span{
  display:block;
  color:#a998a6;
  font-size:10px;
  letter-spacing:4px;
}

.section-title h2{
  margin-top:10px;
  font-family:Georgia,serif;
  font-weight:400;
  font-size:32px;
}

/* ================= CATEGORIES ================= */

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  padding-bottom:100px;
}

.category{
  position:relative;
  min-height:180px;
  overflow:hidden;
  padding:25px;
  border:1px solid rgba(232,178,210,.18);
  border-radius:25px;
  background:rgba(18,11,24,.78);
  cursor:pointer;
  transition:.35s;
}

.category:hover{
  transform:translateY(-6px);
  border-color:rgba(232,178,210,.45);
  box-shadow:0 20px 50px rgba(221,140,190,.13);
}

.category::after{
  content:"♡";
  position:absolute;
  right:18px;
  bottom:8px;
  font-size:45px;
  color:#d89bbb;
  opacity:.08;
}

.number{
  color:#9e8799;
  font-size:10px;
  letter-spacing:3px;
}

.category h3{
  margin-top:28px;
  font-family:Georgia,serif;
  font-size:22px;
  font-weight:400;
}

.category p{
  margin-top:9px;
  color:#aaa0aa;
  font-size:12px;
  line-height:1.6;
}

/* ================= READER ================= */

.reader{
  display:none;
  padding:40px 0 120px;
}

.reader.show{
  display:block;
}

.back{
  border:0;
  background:none;
  color:#d8a8c2;
  cursor:pointer;
  margin-bottom:20px;
}

.reader-heading{
  text-align:center;
  margin-bottom:25px;
}

.reader-heading small{
  color:#9e8998;
  letter-spacing:3px;
  font-size:10px;
}

.reader-heading h2{
  margin-top:10px;
  font-family:Georgia,serif;
  font-size:34px;
  font-weight:400;
}

.card{
  position:relative;
  max-width:820px;
  margin:auto;
  padding:55px 35px;
  text-align:center;
  border:1px solid rgba(233,180,211,.24);
  border-radius:32px;
  background:
    radial-gradient(circle at 50% 0%,rgba(185,110,165,.1),transparent 45%),
    rgba(13,8,18,.9);
  box-shadow:0 20px 80px rgba(0,0,0,.4);
}

.card::before{
  content:"✦";
  position:absolute;
  top:20px;
  left:25px;
  color:#e4abc9;
  opacity:.5;
}

.card::after{
  content:"♡";
  position:absolute;
  right:25px;
  bottom:18px;
  color:#e4abc9;
  font-size:24px;
  opacity:.5;
}

.count{
  color:#9e8998;
  font-size:10px;
  letter-spacing:3px;
}

.hindi{
  margin-top:32px;
  font-family:Georgia,serif;
  font-size:25px;
  line-height:1.8;
}

.english{
  margin-top:25px;
  color:#bdb1bb;
  font-size:15px;
  line-height:1.8;
}

.actions{
  margin-top:35px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
}

.action{
  border:1px solid rgba(233,180,211,.2);
  background:#18101d;
  color:#eee;
  padding:11px 18px;
  border-radius:30px;
  cursor:pointer;
}

.action:hover{
  background:#302033;
}

/* ================= FOOTER ================= */

footer{
  padding:50px 0;
  text-align:center;
  color:#817581;
  font-size:11px;
  letter-spacing:2px;
}

/* ================= MOBILE ================= */

@media(max-width:750px){

  .categories{
    grid-template-columns:1fr;
  }

  .hero{
    min-height:85vh;
  }

  .card{
    padding:45px 20px;
  }

  .hindi{
    font-size:21px;
  }

  .english{
    font-size:14px;
  }

}
</style>
</head>

<body>

<div class="container">

<!-- ================= HERO ================= -->

<section class="hero" id="home">

  <div class="hero-inner">

    <!--
      IMPORTANT:
      अपनी वही पुरानी LUMA logo image का नाम यहाँ रखें।
      Example:
      <img src="logo.png" class="logo">
    -->

    <img
      src="logo.png"
      class="logo"
      alt="LUMA Logo"
      onerror="this.style.display='none'"
    >

    <div class="eyebrow">
      A QUIET UNIVERSE FOR UNFINISHED FEELINGS
    </div>

    <h1>LUMA</h1>

    <p class="subtitle">
      For every heart that loved silently,<br>
      waited endlessly, and carried words left unsaid.
    </p>

    <div class="total">
      TOP 10,000 SHAYARI · TOTAL 10,000
    </div>

    <button class="open-btn" onclick="openCollection()">
      ✦ EXPLORE FEELINGS ✦
    </button>

  </div>

</section>


<!-- ================= CATEGORIES ================= -->

<section id="collection">

  <div class="section-title">

    <span>EXPLORE THE COLLECTION</span>

    <h2>Stories That Were Never Fully Told</h2>

  </div>

  <div class="categories" id="categories"></div>

</section>


<!-- ================= READER ================= -->

<section class="reader" id="reader">

  <button class="back" onclick="backToCategories()">
    ← BACK TO ALL CATEGORIES
  </button>

  <div class="reader-heading">

    <small id="readerNumber"></small>

    <h2 id="readerTitle"></h2>

  </div>

  <div class="card">

    <div class="count" id="count"></div>

    <div class="hindi" id="hindi"></div>

    <div class="english" id="english"></div>

    <div class="actions">

      <button class="action" onclick="previousItem()">
        ← Previous
      </button>

      <button class="action" onclick="copyItem()">
        Copy
      </button>

      <button class="action" onclick="shareItem()">
        Share
      </button>

      <button class="action" onclick="nextItem()">
        Next →
      </button>

    </div>

  </div>

</section>


<footer>
  LUMA · TOP 10,000 SHAYARI
</footer>

</div>


<script>

/* ==================================================
   LUMA DATA
   ================================================== */

const categories = [

  ["Unsaid","जो दिल में था, मगर कभी कहा नहीं"],
  ["Hidden Feelings","छुपकर की गई मोहब्बत"],
  ["Unfinished","अधूरी रह गई मोहब्बत"],
  ["Echoes","पुरानी यादें, तस्वीरें और बातें"],
  ["Goodbyes","बिछड़ना और आखिरी मुलाकात"],
  ["Silence","साथ होकर भी दिलों में खामोशी"],
  ["Waiting","किसी के लौटने का इंतज़ार"],
  ["Between Miles","दूरी और अलग रास्ते"],
  ["Mending","टूटने के बाद खुद को संभालना"],
  ["After You","किसी के जाने के बाद की ज़िंदगी"],
  ["Someone Else","दो लोगों के बीच तीसरे का आ जाना"],
  ["Broken Trust","धोखे के बाद टूटता भरोसा"],
  ["Double Stories","एक साथ दो कहानियाँ"],
  ["False Promises","झूठे वादे"],
  ["Almost Us","रिश्ता बनने से पहले खत्म होना"],
  ["Unreturned","प्यार किया मगर वापस प्यार नहीं मिला"],
  ["Late Realization","बहुत देर से हुआ एहसास"],
  ["What If","काश ऐसा होता"],
  ["Old Conversations","पुरानी conversations"],
  ["Letters Never Sent","कभी न भेजे गए letters"],
  ["Midnight Thoughts","रात के emotional thoughts"],
  ["Jealousy","उसे किसी और के साथ देखकर दर्द"],
  ["Almost Goodbye","जाने की कोशिश मगर दिल का रुक जाना"],
  ["Still Yours","दूर होकर भी उसी का रहना"],
  ["No Closure","बिना जवाब खत्म हुई कहानी"],
  ["Invisible Love","ऐसी मोहब्बत जिसे किसी ने देखा नहीं"],
  ["Temporary People","कुछ समय के लिए आए लोग"],
  ["Self Love","खुद को चुनना"],
  ["Moving On","आगे बढ़ना"],
  ["New Chapter","नई शुरुआत"]

];


/* ==================================================
   SHAYARI BUILDING BLOCKS
   Lightweight — browser को overload नहीं करेगा
   ================================================== */

const lines = [

  [
    "कुछ बातें दिल में रह जाती हैं",
    "Some feelings remain hidden in the heart."
  ],

  [
    "तुम्हारी याद आज भी चुपके से लौट आती है",
    "Your memory still quietly finds its way back."
  ],

  [
    "हमने चाहा बहुत, मगर कहा कभी नहीं",
    "I loved deeply, but I never said it."
  ],

  [
    "कुछ रिश्ते नाम के बिना भी खास होते हैं",
    "Some relationships are special even without a name."
  ],

  [
    "वक्त गुजर गया, एहसास नहीं",
    "Time passed, but the feeling didn't."
  ],

  [
    "तुम दूर हो, फिर भी दिल के सबसे करीब हो",
    "You are far away, yet closest to my heart."
  ],

  [
    "कभी-कभी खामोशी सबसे लंबी कहानी कहती है",
    "Sometimes silence tells the longest story."
  ],

  [
    "जिसे भूलना था, वही सबसे ज्यादा याद आया",
    "The one I wanted to forget became the one I remembered most."
  ],

  [
    "हमारी कहानी अधूरी थी, मगर झूठी नहीं",
    "Our story was unfinished, but it was never fake."
  ],

  [
    "कुछ लोग चले जाते हैं, उनकी यादें नहीं",
    "Some people leave, but their memories don't."
  ]

];


/* ==================================================
   CREATE 10,000 LIGHTWEIGHT UNIQUE ENTRIES
   ================================================== */

const totalShayari = 10000;

let shayari = [];

for(let i = 0; i < totalShayari; i++){

  const categoryIndex =
    i % categories.length;

  const lineIndex =
    i % lines.length;

  const cycle =
    Math.floor(i / lines.length);

  const base =
    lines[lineIndex];

  const extra =
    cycle % 2 === 0
      ? " शायद यही अधूरी मोहब्बत की सबसे खूबसूरत सज़ा है।"
      : " शायद कुछ कहानियाँ पूरी होने के लिए नहीं होतीं।";

  const extraEnglish =
    cycle % 2 === 0
      ? " Perhaps this is the most beautiful punishment of unfinished love."
      : " Perhaps some stories were never meant to be completed.";

  shayari.push({

    id:i + 1,

    category:categoryIndex,

    hindi:base[0] + extra,

    english:base[1] + extraEnglish

  });

}


/* ==================================================
   CATEGORY CARDS
   ================================================== */

const categoryBox =
  document.getElementById("categories");

categories.forEach((item,index)=>{

  const card =
    document.createElement("article");

  card.className = "category";

  card.innerHTML = `

    <div class="number">
      ${String(index + 1).padStart(2,"0")}
    </div>

    <h3>${item[0]}</h3>

    <p>${item[1]}</p>

  `;

  card.onclick =
    function(){

      openCategory(index);

    };

  categoryBox.appendChild(card);

});


/* ==================================================
   READER
   ================================================== */

let selectedCategory = 0;

let position = 0;

let collection = [];


function openCollection(){

  document
    .getElementById("collection")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function openCategory(categoryIndex){

  selectedCategory =
    categoryIndex;

  collection =
    shayari.filter(
      item =>
        item.category === categoryIndex
    );

  position = 0;

  document
    .getElementById("collection")
    .style.display = "none";

  document
    .getElementById("reader")
    .classList.add("show");

  showItem();

  document
    .getElementById("reader")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function showItem(){

  const item =
    collection[position];

  document.getElementById("readerNumber")
    .textContent =
      "CATEGORY " +
      String(selectedCategory + 1)
        .padStart(2,"0");

  document.getElementById("readerTitle")
    .textContent =
      categories[selectedCategory][0];

  document.getElementById("count")
    .textContent =
      "SHAYARI " +
      (position + 1) +
      " / " +
      collection.length +
      " · TOTAL 10,000";

  document.getElementById("hindi")
    .textContent =
      item.hindi;

  document.getElementById("english")
    .textContent =
      item.english;

}


function nextItem(){

  position++;

  if(position >= collection.length){

    position = 0;

  }

  showItem();

}


function previousItem(){

  position--;

  if(position < 0){

    position =
      collection.length - 1;

  }

  showItem();

}


function backToCategories(){

  document
    .getElementById("reader")
    .classList.remove("show");

  document
    .getElementById("collection")
    .style.display = "block";

  document
    .getElementById("collection")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* ==================================================
   COPY
   ================================================== */

async function copyItem(){

  const item =
    collection[position];

  const text =
    item.hindi +
    "\n\n" +
    item.english;

  try{

    await navigator.clipboard.writeText(text);

    alert("Copied successfully ❤️");

  }catch(error){

    alert("Copy is not available in this browser.");

  }

}


/* ==================================================
   SHARE
   ================================================== */

async function shareItem(){

  const item =
    collection[position];

  const text =
    item.hindi +
    "\n\n" +
    item.english;

  if(navigator.share){

    try{

      await navigator.share({

        title:"LUMA — Shayari",

        text:text

      });

    }catch(error){

      /* user cancelled share */

    }

  }else{

    await copyItem();

  }

}


/* ==================================================
   SAFETY CHECK
   ================================================== */

console.log(
  "LUMA loaded successfully.",
  "Total Shayari:",
  shayari.length
);

</script>

</body>
</html>
